name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AutoVoeuxStagetrek.exe
            asset_name: AutoVoeuxStagetrek-Windows.exe
          - os: macos-latest
            artifact_name: AutoVoeuxStagetrek
            asset_name: AutoVoeuxStagetrek-Mac
            zip_name: AutoVoeuxStagetrek-Mac.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installation de Python Intel + dépendances (Mac uniquement)
        if: runner.os == 'macOS'
        run: |
          # Installe une version Intel de Python via homebrew pour compiler
          # les dépendances en x86_64
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          /usr/local/bin/brew install python@3.11 || true
          /usr/local/bin/python3.11 -m pip install --upgrade pip
          /usr/local/bin/python3.11 -m pip install playwright openpyxl pyinstaller

      - name: Compilation ARM (Apple Silicon)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --onefile --name AutoVoeuxStagetrek_arm64
          --collect-all playwright
          --target-arch arm64
          app.py

      - name: Compilation Intel x86_64
        if: runner.os == 'macOS'
        run: >
          /usr/local/bin/python3.11 -m PyInstaller --onefile --name AutoVoeuxStagetrek_x86_64
          --collect-all playwright
          --target-arch x86_64
          app.py

      - name: Fusion en binaire universel (Mac)
        if: runner.os == 'macOS'
        run: |
          lipo -create -output dist/AutoVoeuxStagetrek \
            dist/AutoVoeuxStagetrek_arm64 \
            dist/AutoVoeuxStagetrek_x86_64

      - name: Compilation avec PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --name AutoVoeuxStagetrek
          --collect-all playwright
          app.py

      - name: Création du lanceur .command (Mac uniquement)
        if: runner.os == 'macOS'
        run: |
          cd dist
          cat > "Lancer AutoVoeuxStagetrek.command" << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          chmod +x ./AutoVoeuxStagetrek
          ./AutoVoeuxStagetrek
          EOF
          chmod +x "Lancer AutoVoeuxStagetrek.command"
          chmod +x AutoVoeuxStagetrek
          zip -r ${{ matrix.zip_name }} AutoVoeuxStagetrek "Lancer AutoVoeuxStagetrek.command"

      - name: Upload de l'artefact (aperçu de build)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/*.zip

      - name: Publication sur la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
