name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: AutoVoeuxStagetrek-Windows
          - os: macos-latest
            asset_name: AutoVoeuxStagetrek-Mac-AppleSilicon
            zip_name: AutoVoeuxStagetrek-Mac-AppleSilicon.zip
          - os: macos-13-large
            asset_name: AutoVoeuxStagetrek-Mac-Intel
            zip_name: AutoVoeuxStagetrek-Mac-Intel.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilation avec PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --name AutoVoeuxStagetrek --collect-all playwright app.py
          pyinstaller --onefile --name EffaceurVoeuxStagetrek --collect-all playwright effacer_voeux.py
          if [ "$RUNNER_OS" == "Windows" ]; then
            pyinstaller --onefile --name RecupererVoeux --collect-all playwright --add-data "modele_voeux_campagne.xlsx;." recuperer_voeux.py
          else
            pyinstaller --onefile --name RecupererVoeux --collect-all playwright --add-data "modele_voeux_campagne.xlsx:." recuperer_voeux.py
          fi

      - name: Création des lanceurs .command (Mac uniquement)
        if: runner.os == 'macOS'
        run: |
          cd dist
          
          # Lanceur pour le script d'ajout
          cat > "Lancer AutoVoeuxStagetrek.command" << 'CMDEOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          chmod +x ./AutoVoeuxStagetrek
          ./AutoVoeuxStagetrek
          CMDEOF
          
          # Lanceur pour le script d'effacement
          cat > "Lancer EffaceurVoeuxStagetrek.command" << 'CMDEOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          chmod +x ./EffaceurVoeuxStagetrek
          ./EffaceurVoeuxStagetrek
          CMDEOF

          # Lanceur pour le script de récupération
          cat > "Lancer RecupererVoeux.command" << 'CMDEOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          chmod +x ./RecupererVoeux
          ./RecupererVoeux
          CMDEOF
          
          # Rendre tous les fichiers exécutables
          chmod +x "Lancer AutoVoeuxStagetrek.command"
          chmod +x "Lancer EffaceurVoeuxStagetrek.command"
          chmod +x "Lancer RecupererVoeux.command"
          chmod +x AutoVoeuxStagetrek
          chmod +x EffaceurVoeuxStagetrek
          chmod +x RecupererVoeux
          
          # Zipper les trois applications ensemble
          zip -r ${{ matrix.zip_name }} AutoVoeuxStagetrek "Lancer AutoVoeuxStagetrek.command" EffaceurVoeuxStagetrek "Lancer EffaceurVoeuxStagetrek.command" RecupererVoeux "Lancer RecupererVoeux.command"

      - name: Upload de l'artefact (aperçu de build)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publication sur la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
