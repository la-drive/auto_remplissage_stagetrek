name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AutoVoeuxStagetrek.exe
            asset_name: AutoVoeuxStagetrek-Windows.exe
          - os: macos-latest
            artifact_name: AutoVoeuxStagetrek
            asset_name: AutoVoeuxStagetrek-Mac-AppleSilicon
            zip_name: AutoVoeuxStagetrek-Mac-AppleSilicon.zip
          - os: macos-13
            artifact_name: AutoVoeuxStagetrek
            asset_name: AutoVoeuxStagetrek-Mac-Intel
            zip_name: AutoVoeuxStagetrek-Mac-Intel.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilation avec PyInstaller
        run: >
          pyinstaller --onefile --name AutoVoeuxStagetrek
          --collect-all playwright
          app.py

      - name: Création du lanceur .command (Mac uniquement)
        if: runner.os == 'macOS'
        run: |
          cd dist
          cat > "Lancer AutoVoeuxStagetrek.command" << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          chmod +x ./AutoVoeuxStagetrek
          ./AutoVoeuxStagetrek
          EOF
          chmod +x "Lancer AutoVoeuxStagetrek.command"
          chmod +x AutoVoeuxStagetrek
          zip -r ${{ matrix.zip_name }} AutoVoeuxStagetrek "Lancer AutoVoeuxStagetrek.command"

      - name: Upload de l'artefact (aperçu de build)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/*.zip

      - name: Publication sur la Release (uniquement si un tag v* a été poussé)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
